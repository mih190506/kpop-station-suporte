<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Reembolso</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagem/ks logo.png" type="image/png">
</head>
<body>

   <div class="nav">
     <a href="index.html">📄 Solicitação</a>
     <a href="login.html">💼 Admin</a>
     <a href="consulta.html">🔍 Consultar</a>
  </div>
    
    <h1>Consultar Solicitação 🔍</h1>

    <input type="text" id="busca" placeholder="Digite seu nome ou CPF">
    <button onclick="buscar()">Buscar</button>

    <div id="resultado" style="margin-top: 20px;"></div>

    <h2>Consultar Termos 🔍</h2>
    <input type="text" id="buscaTermo" placeholder="Digite nome ou CPF para buscar">
    <button onclick="buscarTermo()">Buscar Termos</button>
    <div id="resultadoTermos" style="margin-top: 20px;"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA5DBA-4GPDXDyDOgaXfNoZW5rCbaMN4e0",
            authDomain: "ks-suporte.firebaseapp.com",
            databaseURL: "https://ks-suporte-default-rtdb.firebaseio.com",
            projectId: "ks-suporte",
            storageBucket: "ks-suporte.firebasestorage.app",
            messagingSenderId: "23976070359",
            appId: "1:23976070359:web:f5f2258d3b6b55c3d43492"
        };

        firebase.initializeApp(firebaseConfig);

        function buscar() {
           const valorBusca = document.getElementById("busca").value.toLowerCase().trim();
            const resultado = document.getElementById("resultado")

             resultado.innerHTML = "Buscando...";

              firebase.database().ref("reembolsos").once("value", snapshot => {

                    resultado.innerHTML = "";

                    let encontrou = false;

                    snapshot.forEach(item => {
                        const dados = item.val();
                        console.log("DADOS:", dados);

                            if (!dados) return;

                            const nome = dados.nome ? dados.nome.toLowerCase().trim() : "";
                            const cpf = dados.cpf ? dados.cpf.toLowerCase().trim() : "";

                            if (nome.includes(valorBusca) || cpf.includes(valorBusca)) {
                            
                            encontrou = true;

                            const div = document.createElement("div");
                            div.classList.add("card")

                            div.style.border = "1px solid #ccc";
                            div.style.margin = "10px";
                            div.style.padding = "10px";

                            div.innerHTML = `
                                <strong>Nome:</strong> ${dados.nome} <br>
                                <strong>CPF:</strong> ${dados.cpf} <br>
                                <strong>Telefone:</strong> ${dados.telefone || "Não informado"} <br>
                                <strong>Produto:</strong> ${dados.produto} <br>
                                <strong>Tipo de Solicitação:</strong> ${dados.tipoSolicitacao} <br>

                                ${dados.tipoSolicitacao === "reembolso" ? `
                                   <strong>Valor:</strong> R$ ${dados.valor || "0"} <br>
                                `: ""}

                                ${dados.tipoSolicitacao === "reenvio" ? `
                                   <strong>Cidade:</strong> ${dados.cidade || "Não informado"} <br>
                                   <strong>Estado:</strong> ${dados.estado || "Não informado"} <br>
                                `: ""}
                                
                                <strong>Status:</strong> 
                                <span style="color:${dados.status === "pago" ? "green" : "red"}">
                                     ${dados.status || "pendente"}
                                </span>
                            `;

                            const cpfSolicitacao = dados.cpf || "";
                            buscarTermoPorCpf(cpfSolicitacao, div);

                            resultado.appendChild(div);
                        }
                    });

                    if(!encontrou) {
                        resultado.innerHTML = "Nenhum resultado encontrado 😢";
                    }

              });
        }

        function buscarTermo() {
            const busca = document.getElementById("buscaTermo").value.toLowerCase().trim();
            const resultado = document.getElementById("resultadoTermos");

            resultado.innerHTML = "Buscando...";

            firebase.database().ref("termos").once("value", snapshot => {
                resultado.innerHTML = "";

                let encontrou = false;

                snapshot.forEach(item => {
                    const termo = item.val();

                    if (!termo) return;

                    const nome = (termo.nome || "").toLowerCase().trim();
                    const cpf = (termo.cpf || "").toLowerCase().trim();

                    if (nome.includes(busca) || cpf.includes(busca)) {
                        encontrou = true;

                        const div = document.createElement("div");
                        div.classList.add("card");

                        div.innerHTML = `
                        <strong>Nome:</strong> ${termo.nome} <br>
                        <strong>CPF:</strong> ${termo.cpf} <br>
                        <strong>Tipo de Termo:</strong> ${termo.tipo} <br>
                        <strong>Valor:</strong> R$ ${termo.valor} <br>

                        ${termo.fotoTermo ? `
                            <img src="${termo.fotoTermo}" style="max-width:250px; border-radius:10px;">
                            ` : "Nenhuma foto disponível"
                        }

                        `;

                        resultado.appendChild(div);
                    }
                });

                if (!encontrou) {
                    resultado.innerHTML = "Nenhum termo encontrado para essa busca.";
                }
            });
        }

        function buscarTermoPorCpf(cpfBusca, divSolicitacao) {
            firebase.database().ref("termos").once("value", snapshot => {

                let termoEncontrado = false;

                snapshot.forEach(item => {
                    const termo = item.val();

                    if (!termo) return;

                    if ((termo.cpf || "").trim() === cpfBusca.trim()){
                        termoEncontrado = termo;
                    };
                 });

                 if (termoEncontrado) {
                    divSolicitacao.innerHTML += `
                    <hr>
                    <h3> Termo vinculado 📄</h3>
                    <strong>Tipo de Termo:</strong> ${termoEncontrado.tipo} <br>
                    <strong>Valor:</strong> R$ ${termoEncontrado.valor} <br><br>

                    ${termoEncontrado.fotoTermo ? `
                        <img src="${termoEncontrado.fotoTermo}" style="max-width:250px; border-radius:10px;">
                     ` : "Nenhuma foto disponível"
                    }
                    `;

                } else {
                    divSolicitacao.innerHTML += `
                    <hr>
                    <strong>Termo vinculado:</strong> Nenhum termo encontrado para este CPF.
                    `;
                }
            });
         }
        

    </script>

</body>
</html>
