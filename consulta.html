<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Reembolso</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagem/ks logo.png" type="image/png">
</head>
<body>

    <div class="nav">
        <a href="index.html">📄 Reembolso</a>
        <a href="login.html">💼 Admin</a>
        <a href="consulta.html">🔍 Consultar</a>
    </div>
    
    <h1>Consultar Reembolso 🔍</h1>

    <input type="text" id="busca" placeholder="Digite seu nome ou pedido">
    <button onclick="buscar()">Buscar</button>

    <div id="resultado" style="margin-top: 20px;"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA5DBA-4GPDXDyDOgaXfNoZW5rCbaMN4e0",
            authDomain: "ks-suporte.firebaseapp.com",
            databaseURL: "https://ks-suporte-default-rtdb.firebaseio.com",
            projectId: "ks-suporte",
            storageBucket: "ks-suporte.firebasestorage.app",
            messagingSenderId: "23976070359",
            appId: "1:23976070359:web:f5f2258d3b6b55c3d43492"
        };

        firebase.initializeApp(firebaseConfig);

        function buscar() {
           const valorBusca = document.getElementById("busca").value.toLowerCase().trim();
            const resultado = document.getElementById("resultado")

             resultado.innerHTML = "Buscando...";

              firebase.database().ref("reembolsos").once("value", snapshot => {

                    resultado.innerHTML = "";

                    let encontrou = false;

                    snapshot.forEach(item => {
                        const dados = item.val();
                        console.log("DADOS:", dados);

                            if (!dados) return;

                            const nome = dados.nome ? dados.nome.toLowerCase().trim() : "";
                            const pedido = dados.pedido ? dados.pedido.toLowerCase().trim() : "";

                            if (nome.includes(valorBusca) || pedido.includes(valorBusca)) {
                            
                            encontrou = true;

                            const div = document.createElement("div");
                            div.classList.add("card")

                            div.style.border = "1px solid #ccc";
                            div.style.margin = "10px";
                            div.style.padding = "10px";

                            div.innerHTML = `
                                <strong>Nome:</strong> ${dados.nome} <br>
                                <strong>Pedido:</strong> ${dados.pedido} <br>
                                <strong>Produto:</strong> ${dados.produto} <br>
                                <strong>Valor:</strong> R$ ${dados.valor} <br>
                                <strong>Status:</strong> 
                                <span style="color:${dados.status === "pago" ? "green" : "red"}">
                                     ${dados.status || "pendente"}
                                </span>
                            `;

                            resultado.appendChild(div);
                        }
                    });

                    if(!encotrou) {
                        resultado.innerHTML = "Nenhum resultado encontrado 😢";
                    }

              });
        }

    </script>

</body>
</html>
