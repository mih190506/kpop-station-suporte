<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagem/ks logo.png" type="image/png">
</head>
<body>

    <div class="nav">
        <a href="index.html">📄 Solicitação</a>
        <a href="login.html">💼 Admin</a>
        <a href="consulta.html">🔍 Consultar</a>
    </div>

    <div class="admin-topo">

         <button onclick="logout()">Sair</button>
         
         <div class="admin-header">
            <h1>Painel de Reembolsos 💼</h1>
         </div>

         <div id="dashboard" style="margin-bottom: 20px;" class="container">
            <h2>Resumo 📊</h2>
            <p>Total de Solicitações: <span id="totalSolicitacoes">0</span></p>
            <p>Reembolsos: <span id="totalReembolsos">0</span></p>
            <p>Reenvios: <span id="totalReenvios">0</span></p>
            <p>Em Análise: <span id="emAnalise">0</span></p>
            <p>Aprovados: <span id="aprovados">0</span></p>
            <p>Recusados: <span id="recusados">0</span></p>
            <p>Pagos: <span id="pagos">0</span></p>
            <p>Cancelados: <span id="cancelados">0</span></p>
         </div>

         <div class="filtros">
             <button onclick="Filtrar('todos')">Todos</button>
             <button onclick="Filtrar('reembolso')">Reembolsos</button>
             <button onclick="Filtrar('reenvio')">Reenvios</button>
             <button onclick="Filtrar('em análise')">Em Análise</button>
             <button onclick="Filtrar('aprovado')">Aprovados</button>
             <button onclick="Filtrar('recusado')">Recusados</button>
             <button onclick="Filtrar('pago')">Pagos</button>
             <button onclick="Filtrar('cancelado')">Cancelados</button>
         </div>
    </div>

    <div id="lista"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA5DBA-4GPDXDyDOgaXfNoZW5rCbaMN4e0",
            authDomain: "ks-suporte.firebaseapp.com",
            databaseURL: "https://ks-suporte-default-rtdb.firebaseio.com",
            projectId: "ks-suporte",
            storageBucket: "ks-suporte.firebasestorage.app",
            messagingSenderId: "23976070359",
            appId: "1:23976070359:web:f5f2258d3b6b55c3d43492"
        };

        firebase.initializeApp(firebaseConfig);

        if(localStorage.getItem("logado") !== "true"){
            window.location.href = "login.html"
        }

        const lista = document.getElementById("lista");

         let filtroAtual = "todos";

         function formatarData(data){
            if (!data) return "Não informada";

            const partes = data.split("-");
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
         }

        function carregarDados() {
            
            firebase.database().ref("reembolsos").off();
            firebase.database().ref("reembolsos").on("value", snapshot => {
                lista.innerHTML = "";

                let totalSolicitacoes = 0;
                let totalReembolsos = 0;
                let totalReenvios = 0;
                let emAnalise = 0;
                let aprovados = 0;
                let recusados = 0;
                let pagos = 0;
                let cancelados = 0;

                snapshot.forEach(item => {
                    const dados = item.val();

                    const dataFormatada = dados.data
                    ? new Date(dados.data).toLocaleString("pt-BR")
                    : "Sem Data";

                    totalSolicitacoes++;
                    if (dados.tipoSolicitacao === "reembolso") {
                        totalReembolsos++;
                    }

                    if (dados.tipoSolicitacao === "reenvio") {
                        totalReenvios++;
                    }

                     if (dados.status === "em análise") {
                        emAnalise++;
                    } else if (dados.status === "aprovado") {
                        aprovados++;
                    } else if (dados.status === "recusado") {
                        recusados++;
                    } else if (dados.status === "pago") {
                        pagos++;
                    } else if (dados.status === "cancelado") {
                        cancelados++;
                    }

                    document.getElementById("totalSolicitacoes").innerText = totalSolicitacoes;
                    document.getElementById("totalReembolsos").innerText = totalReembolsos;
                    document.getElementById("totalReenvios").innerText = totalReenvios;
                    document.getElementById("emAnalise").innerText = emAnalise;
                    document.getElementById("aprovados").innerText = aprovados;
                    document.getElementById("recusados").innerText = recusados;
                    document.getElementById("pagos").innerText = pagos;
                    document.getElementById("cancelados").innerText = cancelados;
                    const status = dados.status || "em análise";
                    const tipoSolicitacao = dados.tipoSolicitacao || "";

                    if (filtroAtual !== "todos" && status !== filtroAtual && tipoSolicitacao !== filtroAtual) {
                        return;
                    }

                    const div = document.createElement("div");
                    div.classList.add("card")

                    div.style.border = "1px solid #ccc";
                    div.style.margin = "10px";
                    div.style.padding = "10px";

                   div.innerHTML = `
                        <strong>Data da solicitação:</strong> ${dataFormatada} <br>
                        <strong>Tipo de solicitação:</strong> ${dados.tipoSolicitacao || "Não informado"} <br>
                        <strong>Nome:</strong> ${dados.nome || "Não informado"} <br>
                        <strong>CPF:</strong> ${dados.cpf || "Não informado"} <br>
                        <strong>Telefone:</strong> ${dados.telefone || "Não informado"} <br>
                        <strong>Produto:</strong> ${dados.produto || "Não informado"} <br>

                        ${dados.tipoSolicitacao === "reembolso" ? `
                            <h3> Dados do Reembolso 💰</h3>
                            <strong>Tipo:</strong> ${dados.tipo} <br>
                            <strong>Valor:</strong> R$ ${dados.valor} <br>
                            <strong>PIX:</strong> ${dados.pix || "Não informado"} <br>
                            <strong>Banco:</strong> ${dados.banco || "Não informado"} <br>
                            <strong>Data de Reembolso:</strong> ${formatarData(dados.dataReembolso) || "Não informada"} <br>
                            <strong>Motivo:</strong> ${dados.motivo || "Não informado"} <br>

                            <strong>Comprovante:</strong><br>
                            ${dados.comprovanteArquivo ? `
                            ${
                                dados.comprovanteArquivo.startsWith("data:image")
                                ? `<img src="${dados.comprovanteArquivo}" style="max-width:250px; margin-top:10px; border-radius:8px;">`
                                : `<a href="${dados.comprovanteArquivo}" target="_blank" style="color:#ffb3b3;">Ver comprovante PDF 📎</a>`
                            }
                        ` : "Não enviado"}

                        <br><br>

                        <strong>Termos de Reembolso:</strong> 
                        <span style="color:${dados.acordoDeReembolso ? "#00ffae" : "#ff7675"}">
                             ${dados.acordoDeReembolso ? "Aceito ✔" : "Não aceito ❌"}
                        </span>
                        <br><br>

                        ` : ""}

                    ${dados.tipoSolicitacao === "reenvio" ? `
                        <h3> Dados do Reenvio 📦 </h3>
                        <strong>Endereço:</strong> ${dados.endereco || "Não informado"} <br>
                        <strong>Número:</strong> ${dados.numero || "Não informado"} <br>
                        <strong>Complemento:</strong> ${dados.complemento || "Não informado"} <br>
                        <strong>Bairro:</strong> ${dados.bairro || "Não informado"} <br>
                        <strong>Cidade:</strong> ${dados.cidade || "Não informado"} <br>
                        <strong>Estado:</strong> ${dados.estado || "Não informado"} <br>
                        <strong>CEP:</strong> ${dados.cep || "Não informado"} <br>
                        <strong>Data de Reenvio:</strong> ${formatarData(dados.dataReenvio) || "Não informada"} <br><br>

                         <strong>Termos de Envio:</strong> 
                        <span style="color:${dados.acordoEnvio ? "#00ffae" : "#ff7675"}">
                            ${dados.acordoEnvio ? "Aceito ✔" : "Não aceito ❌"}
                        </span>
                        <br><br>

                    ` : ""}

                        <strong>Status:</strong> 
                        <span style="color:${{
                                "em análise": "#f1c40f",
                                "aprovado": "#3498db",
                                "recusado": "#e74c3c",
                                "pago": "#2ecc71",
                                "cancelado": "#95a5a6"
                            }[dados.status] || "#ccc"}">
                            ${dados.status || "em análise"}
                        </span>
                        <br><br>


                        <div style="margin-top:10px;">
                            <button onclick="alterarStatus('${item.key}', 'em análise')">Em análise</button>
                            <button onclick="alterarStatus('${item.key}', 'aprovado')">Aprovar</button>
                            <button onclick="alterarStatus('${item.key}', 'recusado')">Recusar</button>
                            <button onclick="alterarStatus('${item.key}', 'pago')">Pago</button>
                            <button onclick="alterarStatus('${item.key}', 'cancelado')" style="background:#555;">Cancelar</button>
                        </div>

                        <button onclick="excluir('${item.key}')" style="background:#444; margin-top:5px;"> Excluir 🗑️ </button>
                    `;

                    const cpfSolicitacao = dados.cpf || "";
                    buscarTermoPorCpf(cpfSolicitacao, div);

                    lista.appendChild(div);
                });


                window.alterarStatus = function(id, novoStatus) {
                 firebase.database().ref("reembolsos/" + id).update({
                    status: novoStatus
                    });
                }

            });

        }

        function buscarTermoPorCpfAdmin(cpfBusca, divSolicitacao) {
            firebase.database().ref("termos").once("value", snapshot => {
                let termoEncontrado = false;

                snapshot.forEach(item => {
                    const termo = item.val();

                    if (!termo) return;

                    if ((termo.cpf || "").trim() === cpfBUsca.trim ()){
                        termoEncontrado = termo;
                    }
                });

                if(termoEncontrado){
                    divSolicitacao.innerHTML += `
                    <hr>
                    <h3>Termo vinculado 📄</h3>
                    <strong>Tipo:</strong> ${termoEncontrado.tipo || termoEncontrado.tipoTermo} <br>
                    <strong>Valor:</strong> R$ ${termoEncontrado.valor || termoEncontrado.valorTermo} <br><br>
                    ${
                        termoEncontrado.fotoTermo || termoEncontrado.fotoTermoArquivo
                        ?`<img src="${termoEncontrado.fotoTermo || termoEncontrado.fotoTermoArquivo}" style="max-width:250px; border-radius:10px;">`
                        : "Nenhuma foto disponível"
                    }
                        `;
                }
            });
        }

         window.Filtrar = function(tipo) {
                    filtroAtual = tipo;
                    carregarDados();
                }

                carregarDados();

        function logout() {
            localStorage.removeItem("logado");
            window.location.href = "login.html";
        }

        window.excluir = function(id){
            const confirmar = confirm("Tem certeza de que deseja excluir esta solicitação?");

            if(!confirmar) return;

            firebase.database().ref("reembolsos/" + id).remove();
        }


    </script>

</body>
</html>
